name: Cache Realtor.com CSVs

on:
  schedule:
    # Run every Monday at 6 AM UTC (1 AM CT)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  cache-csvs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create data directory
        run: mkdir -p data/cache

      - name: Download National CSV
        run: |
          curl -sL -o data/cache/us_history.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_Country_History.csv"
          echo "National: $(wc -l < data/cache/us_history.csv) rows"

      - name: Download State CSV
        run: |
          curl -sL -o data/cache/state_history.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_State_History.csv"
          echo "State: $(wc -l < data/cache/state_history.csv) rows"

      - name: Download Metro CSV
        run: |
          curl -sL -o data/cache/metro_history.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_Metro_History.csv"
          echo "Metro: $(wc -l < data/cache/metro_history.csv) rows"

      - name: Download County CSV
        run: |
          curl -sL -o data/cache/county_history.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_County_History.csv"
          echo "County: $(wc -l < data/cache/county_history.csv) rows"

      - name: Download Zip CSV
        run: |
          curl -sL -o data/cache/zip_history.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_Zip_History.csv"
          echo "Zip: $(wc -l < data/cache/zip_history.csv) rows"

      - name: Download Weekly Inventory CSV
        run: |
          curl -sL -o data/cache/weekly_inventory.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/listing_weekly_core_aggregate_by_country.csv"
          echo "Weekly: $(wc -l < data/cache/weekly_inventory.csv) rows"

      - name: Record timestamp
        run: |
          echo "{\"last_updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"files\": [\"us_history.csv\",\"state_history.csv\",\"metro_history.csv\",\"county_history.csv\",\"zip_history.csv\",\"weekly_inventory.csv\"]}" > data/cache/manifest.json

      - name: Commit and push
        run: |
          git config user.name "Frankyfive"
          git config user.email "Franco1824@gmail.com"
          git add data/cache/
          git diff --staged --quiet || git commit -m "Cache Realtor.com CSVs - $(date -u +%Y-%m-%d)"
          git push
