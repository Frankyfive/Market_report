name: Update MBA Purchase Index

on:
  schedule:
    # 15:00 UTC Wednesdays (~10-11am ET) — MBA releases its survey ~7am ET
    # Wednesdays, giving the email automation time to land the new value
    # in the Google Sheet first.
    - cron: '0 15 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync new values from Google Sheet
        run: python3 scripts/sync_mba_from_sheet.py

      - name: Regenerate cached CSV
        run: python3 scripts/extract_mba_csv.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual/mba_manual.json data/cache/mba_purchase_index.csv
          git diff --staged --quiet || git commit -m "Update MBA Purchase Index - $(date -u +%Y-%m-%d)"
          git push
