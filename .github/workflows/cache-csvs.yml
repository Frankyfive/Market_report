name: Cache Realtor.com CSVs

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-csvs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create data directory
        run: mkdir -p data/cache

      - name: Download National CSV
        run: |
          curl -sL -o data/cache/us_history.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_Country_History.csv"
          echo "National: $(wc -l < data/cache/us_history.csv) rows"

      - name: Download State CSV - filter to TX and CO only
        run: |
          curl -sL "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_State_History.csv" | \
            head -1 > data/cache/state_history.csv
          curl -sL "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_State_History.csv" | \
            grep -E ",TX,|,CO," >> data/cache/state_history.csv
          echo "State (filtered): $(wc -l < data/cache/state_history.csv) rows"

      - name: Download Metro CSV - filter to target metros only
        run: |
          FULL=$(curl -sL "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_Metro_History.csv")
          echo "$FULL" | head -1 > data/cache/metro_history.csv
          echo "$FULL" | grep -E "^[0-9]+,(19100|26420|19740|41700|12420|21340|17820|32580)," >> data/cache/metro_history.csv
          echo "Metro (filtered): $(wc -l < data/cache/metro_history.csv) rows"

      - name: Download Weekly Inventory CSV
        run: |
          curl -sL -o data/cache/weekly_inventory.csv \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/listing_weekly_core_aggregate_by_country.csv"
          echo "Weekly: $(wc -l < data/cache/weekly_inventory.csv) rows"

      - name: Record timestamp
        run: |
          echo "{\"last_updated\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"files\": [\"us_history.csv\",\"state_history.csv\",\"metro_history.csv\",\"weekly_inventory.csv\"]}" > data/cache/manifest.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          git diff --staged --quiet || git commit -m "Cache Realtor.com CSVs - $(date -u +%Y-%m-%d)"
          git push
